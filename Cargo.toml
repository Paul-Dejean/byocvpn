[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/app",
    "crates/cli",
    "crates/daemon",
    "crates/ui/src-tauri",
    "crates/infra/aws",
    "crates/infra/oracle",
    "crates/infra/gcp",
    "crates/infra/azure",
    "crates/android",
]

[workspace.package]
version = "0.1.32"
rust-version = "1.100"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
tokio = { version = "1.54.1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
async-trait = "0.1.92"
base64 = "0.23.1"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
thiserror = "2.0.21"
rand = "0.10.4"
handlebars = "6.4.4"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
log = "0.4.35"
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes", "log"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "std", "tracing-log"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "query",
    "rustls",
] }
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
sha2 = "0.11.1"
uuid = { version = "1.29.3", features = ["v4"] }
hex = "0.4.3"
jiff = { version = "1.0.2", default-features = false, features = ["std", "serde"] }
ipnet = "2.12.2"
tun-rs = { version = "2.8.18", features = ["async_tokio"] }
windows-sys = "0.61.2"
tauri = "2.12.7"
strum = { version = "0.28.0", features = ["derive"] }


[workspace.lints.rust]
unused_qualifications = "deny"
let_underscore_drop = "deny"
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
redundant_lifetimes = "deny"
unit_bindings = "deny"
unused_macro_rules = "deny"
non_ascii_idents = "deny"
meta_variable_misuse = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"
use_debug = "deny"
indexing_slicing = "deny"
string_slice = "deny"
deref_by_slicing = "deny"
as_conversions = "deny"
fn_to_numeric_cast_any = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
absolute_paths = "deny"
unnecessary_self_imports = "deny"
iter_over_hash_type = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mem_forget = "deny"
multiple_unsafe_ops_per_block = "deny"
shadow_unrelated = "deny"
shadow_same = "deny"
ref_patterns = "deny"
partial_pub_fields = "deny"
same_name_method = "deny"
renamed_function_params = "deny"
redundant_type_annotations = "deny"
if_then_some_else_none = "deny"
unneeded_field_pattern = "deny"
infinite_loop = "deny"
pathbuf_init_then_push = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
string_add = "deny"
string_add_assign = "deny"
format_push_string = "deny"
string_lit_chars_any = "deny"
needless_raw_strings = "deny"
unseparated_literal_suffix = "deny"
same_functions_in_if_condition = "deny"
suspicious_xor_used_as_pow = "deny"
try_err = "deny"
map_with_unused_argument_over_ranges = "deny"
tests_outside_test_module = "deny"
missing_assert_message = "deny"
assertions_on_result_states = "deny"
self_named_module_files = "deny"
large_include_file = "deny"
disallowed_script_idents = "deny"
min_ident_chars = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"

[profile.release]
overflow-checks = true
lto = true
codegen-units = 1
strip = true
