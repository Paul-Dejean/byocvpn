[package]
name = "byocvpn_aws"
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
edition = "2024"

[dependencies]
byocvpn_core = { path = "../../core" }
async-trait = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
aws-types = "1.7.0"
aws-sdk-ec2 = { version = "1.283.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-ssm = { version = "1.139.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-credential-types = "1.3.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
jiff = { workspace = true }
strum = { workspace = true }

specta = { workspace = true, optional = true }
aws-sdk-sts = { version = "1.128.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-iam = { version = "1.139.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-pricing = { version = "1.126.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }

[features]
specta = ["dep:specta"]

[lints]
workspace = true
