[package]
name = "byocvpn_azure"
version.workspace = true
edition = "2024"

[dependencies]
byocvpn_core = { path = "../../core" }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
handlebars = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
# Official Azure Identity library — ClientSecretCredential for service principal auth.
azure_identity = { version = "1.0", default-features = false }
# azure_core provides the Secret type and TokenCredential trait.
azure_core = { version = "1.1", default-features = false, features = [
    "reqwest",
    "reqwest_deflate",
    "reqwest_gzip",
] }
chrono = { workspace = true }

specta = { workspace = true, optional = true }

[features]
specta = ["dep:specta"]
