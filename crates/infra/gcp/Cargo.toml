[package]
name = "byocvpn_gcp"
version.workspace = true
edition = "2024"

[dependencies]
byocvpn_core = { path = "../../core" }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
google-cloud-auth = "1.17.0"
google-cloud-compute-v1 = { version = "4.1.0", default-features = false, features = [
    "instances",
    "networks",
    "subnetworks",
    "firewalls",
    "regions",
    "images",
] }
google-cloud-gax = "1.15.0"
google-cloud-lro = "1.11.0"
http = "1.5.0"
chrono = { workspace = true }
strum = { workspace = true }

specta = { workspace = true, optional = true }

[features]
specta = ["dep:specta"]

[lints]
workspace = true
