[changelog]
trim = true
body = """
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope and commit.scope != "deps" %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix\\(lints\\)", skip = true },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^chore\\(deps\\)", group = "<!-- 3 -->Dependencies" },
  { message = "^(chore|ci|build|refactor|docs|style|test)", skip = true },
]
