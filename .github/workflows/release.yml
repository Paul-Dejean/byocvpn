name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - runner: macos-latest
            rust_target: aarch64-apple-darwin
          - runner: macos-latest
            rust_target: x86_64-apple-darwin
          - runner: windows-latest
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> target/tauri
          cache-on-failure: true

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: crates/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/ui
        run: npm ci

      - name: Pre-build daemon (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          $env:CARGO_TARGET_DIR = "target"
          cargo build --locked --release -p byocvpn_daemon --manifest-path Cargo.toml --target ${{ matrix.rust_target }}
          New-Item -ItemType Directory -Force -Path "target\release" | Out-Null
          Copy-Item "target\${{ matrix.rust_target }}\release\byocvpn_daemon.exe" "target\release\byocvpn_daemon.exe"
          New-Item -ItemType Directory -Force -Path "target\tauri\${{ matrix.rust_target }}\release" | Out-Null
          Copy-Item "target\${{ matrix.rust_target }}\release\byocvpn_daemon.exe" "target\tauri\${{ matrix.rust_target }}\release\byocvpn_daemon.exe"

      - name: Pre-build daemon (non-Windows)
        if: matrix.runner != 'windows-latest'
        run: |
          CARGO_TARGET_DIR=target cargo build --locked --release -p byocvpn_daemon --manifest-path Cargo.toml --target ${{ matrix.rust_target }}
          mkdir -p target/release
          cp target/${{ matrix.rust_target }}/release/byocvpn_daemon target/release/byocvpn_daemon

      - name: Verify daemon binary exists (Windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: Get-Item "target\release\byocvpn_daemon.exe"

      - name: Create plist placeholder (non-macOS)
        if: "!startsWith(matrix.runner, 'macos')"
        run: touch scripts/com.byocvpn.daemon.plist

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_TARGET_DIR: target/tauri
        with:
          projectPath: crates/ui
          tagName: ${{ github.ref_name }}
          releaseName: ByocVPN ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }} --verbose ${{ startsWith(matrix.runner, 'macos') && '--config src-tauri/tauri.macos.release.conf.json' || '' }}

      - name: Repack and upload Linux deb
        if: startsWith(matrix.runner, 'ubuntu')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEB=$(find target/tauri -name "*.deb" | head -1)
          dpkg-deb --raw-extract "$DEB" deb_repack
          cp scripts/deb-scripts/postinst deb_repack/DEBIAN/postinst
          cp scripts/deb-scripts/prerm    deb_repack/DEBIAN/prerm
          cp scripts/deb-scripts/postrm   deb_repack/DEBIAN/postrm
          chmod 755 deb_repack/DEBIAN/postinst deb_repack/DEBIAN/prerm deb_repack/DEBIAN/postrm
          dpkg-deb --build deb_repack "$DEB"

          gh release upload "${{ github.ref_name }}" "$DEB" --clobber

      - name: Package and upload Windows release bundle
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content "crates/ui/src-tauri/tauri.conf.json" | ConvertFrom-Json).version
          $msi = Get-ChildItem -Path "target/tauri" -Recurse -Filter "*.msi" | Select-Object -First 1
          $bundleDir = "ByocVPN-Windows-x64-v$version"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null
          Copy-Item $msi.FullName "$bundleDir\ByocVPN-Installer.msi"
          Compress-Archive -Path $bundleDir -DestinationPath "$bundleDir.zip"
          gh release upload "${{ github.ref_name }}" "$bundleDir.zip" --clobber

      - name: Package and upload macOS release bundle
        if: startsWith(matrix.runner, 'macos')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'import sys,json; print(json.load(open("crates/ui/src-tauri/tauri.conf.json"))["version"])')
          case "${{ matrix.rust_target }}" in
            aarch64-apple-darwin) ARCH="arm64" ;;
            x86_64-apple-darwin)  ARCH="x64" ;;
          esac

          pkgbuild \
            --nopayload \
            --scripts scripts/uninstaller-pkg-scripts \
            --identifier com.byocvpn.uninstaller \
            --version "$VERSION" \
            --install-location / \
            ByocVPN-Uninstaller.pkg

          APP=$(find target/tauri -name "*.app" | head -1)
          pkgbuild \
            --component "$APP" \
            --scripts scripts/pkg-scripts \
            --identifier com.byocvpn.app \
            --version "$VERSION" \
            --install-location /Applications \
            ByocVPN-Installer.pkg

          INSTALLER_PKG=ByocVPN-Installer.pkg

          BUNDLE_DIR="ByocVPN-macOS-${ARCH}-v${VERSION}"
          mkdir "$BUNDLE_DIR"
          cp "$INSTALLER_PKG" "$BUNDLE_DIR/ByocVPN-Installer.pkg"
          cp ByocVPN-Uninstaller.pkg "$BUNDLE_DIR/ByocVPN-Uninstaller.pkg"
          zip -r "$BUNDLE_DIR.zip" "$BUNDLE_DIR"

          gh release upload "${{ github.ref_name }}" "$BUNDLE_DIR.zip" --clobber

  build-android:
    needs: build
    if: ${{ !cancelled() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_RUST_TARGET: aarch64-linux-android

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ANDROID_RUST_TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target/tauri
          key: android
          cache-on-failure: true

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: crates/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: crates/ui
        run: npm ci

      - name: Build Android APK and AAB
        working-directory: crates/ui
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/tauri
        run: npx tauri android build --apk --aab --target aarch64

      - name: Sign and upload Android APK and AAB
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set; cannot sign the APK"
            exit 1
          fi

          VERSION=$(python3 -c 'import json; print(json.load(open("crates/ui/src-tauri/tauri.conf.json"))["version"])')
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED_APK=$(find crates/ui/src-tauri/gen/android/app/build/outputs/apk -name "*-release-unsigned.apk" | head -1)
          UNSIGNED_AAB=$(find crates/ui/src-tauri/gen/android/app/build/outputs/bundle -name "*-release.aab" | head -1)
          SIGNED_APK="ByocVPN-Android-arm64-v${VERSION}.apk"
          SIGNED_AAB="ByocVPN-Android-arm64-v${VERSION}.aab"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          "$BUILD_TOOLS/zipalign" -p 4 "$UNSIGNED_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out "$SIGNED_APK" \
            aligned.apk
          "$BUILD_TOOLS/apksigner" verify "$SIGNED_APK"

          cp "$UNSIGNED_AAB" "$SIGNED_AAB"
          jarsigner \
            -keystore release.keystore \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEY_PASSWORD \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$SIGNED_AAB" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify "$SIGNED_AAB"
          rm release.keystore aligned.apk

          gh release upload "${{ github.ref_name }}" "$SIGNED_APK" "$SIGNED_AAB" --clobber
