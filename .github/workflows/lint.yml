name: Lint

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HUSKY: 0

jobs:
  backend:
    name: Backend (rustfmt + clippy) on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_RUST_TARGET: aarch64-linux-android
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Create placeholder frontend build
        run: mkdir -p crates/ui/dist

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check the release profile
        if: runner.os == 'Linux'
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo check --workspace --release --locked

      - name: Install the Android NDK and Rust target
        if: runner.os == 'Linux'
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}" > /dev/null
          rustup target add "$ANDROID_RUST_TARGET"
          NDK_BIN="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
            echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"

      - name: Check the Android app
        if: runner.os == 'Linux'
        env:
          CARGO_BUILD_WARNINGS: deny
        run: cargo check -p ui --target "$ANDROID_RUST_TARGET" --locked

  dependencies:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --locked

  frontend-dependencies:
    name: Frontend dependencies (pnpm audit + licenses)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ui
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: crates/ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm run deps:audit

      - name: Check licenses
        run: pnpm run deps:licenses

  frontend:
    name: Frontend (oxlint + eslint + oxfmt + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/ui
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: crates/ui/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: crates/ui/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm exec vite build

      - name: Check bundle size
        run: pnpm run build:check-size
